# Install as: /etc/systemd/system/haproxy.service.d/override.conf
#
# RHEL9's stock haproxy.service only loads /etc/haproxy/haproxy.cfg.
# This override clears the default ExecStart/ExecReload and re-adds
# them with an extra -f pointing at conf.d/, which HAProxy will read
# as a directory (all *.cfg files inside, in alphabetical order).
#
# Setup:
#   sudo mkdir -p /etc/systemd/system/haproxy.service.d
#   sudo cp haproxy-override.conf /etc/systemd/system/haproxy.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo haproxy -c -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d
#   sudo systemctl restart haproxy

[Service]
ExecStart=
ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/conf.d -p /run/haproxy.pid $OPTIONS
ExecReload=
ExecReload=/usr/sbin/haproxy -c -f /etc/haproxy/conf.d
ExecReload=/bin/kill -USR2 $MAINPID
