#---------------------------------------------------------------------
# /etc/haproxy/conf.d/30-ldaps.cfg
# LDAPS (636) - TCP passthrough (recommended: keeps end-to-end TLS
# intact, HAProxy never needs the server's private key).
#---------------------------------------------------------------------
frontend ldaps_frontend
  # simple passthrough format
  # bind *:636
  # re-encrypt format (terminate client SSL, create new SSL connection to
  # backend) (requires setting "send-proxy-v2" pass through original client IP)
  bind *:636 ssl crt /etc/haproxy/certs/ldap-vip-fullchain.pem
  mode tcp
  default_backend ldaps_backend

backend ldaps_backend
  mode tcp
  balance leastconn
  tcp-check connect
  option ldap-check 
  default-server send-proxy-v2 check inter 5s fall 3 rise 2

  # do we really need to specify the ca IF using LetsEncrypt?
  # assume we already trust the LetsEncrypt root CA
  # default-server ssl verify required ca-file /etc/haproxy/certs/internal-ca.pem
  # default-server ssl verify required
  default-server ssl verify none #for testing

  # If DS also requires HAProxy to present a client cert (mTLS)
  # SAME CERT AS ABOVE (ie: LOCAL HOST CERT)
  default-server crt /etc/haproxy/certs/haproxy-client.pem


  #___HAPROXY_BACKEND_SERVERS___
  # server ds389-01 10.0.0.11:636 check inter 5s fall 3 rise 2
  # server ds389-02 10.0.0.12:636 check inter 5s fall 3 rise 2
  # server ds389-03 10.0.0.13:636 check inter 5s fall 3 rise 2

# Alternative: terminate TLS on HAProxy instead of passthrough.
