#---------------------------------------------------------------------
# /etc/haproxy/conf.d/30-ldaps.cfg
# LDAPS (636) - TCP passthrough (recommended: keeps end-to-end TLS
# intact, HAProxy never needs the server's private key).
#---------------------------------------------------------------------
frontend ldaps_frontend
    bind *:636
    mode tcp
    default_backend ldaps_backend

backend ldaps_backend
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect

    server ds389-01 10.0.0.11:636 check inter 5s fall 3 rise 2
    server ds389-02 10.0.0.12:636 check inter 5s fall 3 rise 2
    server ds389-03 10.0.0.13:636 check inter 5s fall 3 rise 2

# Alternative: terminate TLS on HAProxy instead of passthrough.
# frontend ldaps_frontend_terminate
#     bind *:636 ssl crt /etc/haproxy/certs/ldap-combined.pem
#     mode tcp
#     default_backend ldap_backend
